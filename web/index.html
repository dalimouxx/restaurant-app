<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#101418" />
    <title>Service — Gestion de restaurant</title>
    <!--
      Installation sur l'écran d'accueil : un manifeste par poste.

      Il est posé ICI, à l'analyse de la page, et non par l'application
      une fois démarrée. Le navigateur décide de ce qu'il installera au
      tout début du chargement : un manifeste arrivé après coup le
      trouve déjà fixé, et c'est ainsi qu'on installait « Gestion » pour
      se retrouver devant l'écran client.

      Le script vit dans un fichier et non ici : la politique de
      sécurité de la page n'autorise que les scripts de même origine,
      et un script écrit dans le HTML serait bloqué sans un mot.
    -->
    <script src="/poste.js"></script>
    <meta name="theme-color" content="#101418" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
