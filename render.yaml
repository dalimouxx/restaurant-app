# Blueprint Render — service web uniquement.
# La base PostgreSQL est hébergée chez Neon (voir DEPLOIEMENT-RENDER.md).
#
# Dans Render : New → Blueprint → sélectionnez ce dépôt.
# Trois valeurs vous seront demandées : DATABASE_URL, ADMIN_EMAIL,
# ADMIN_PASSWORD.
#
# Région : Frankfurt, la plus proche de la Tunisie. Choisissez la même
# région chez Neon pour limiter la latence entre le service et la base.
#
# ⚠️ Plan gratuit Render : le service s'endort après 15 min sans trafic
# (réveil ~1 min), ce qui coupe les WebSockets — l'écran cuisine cesse de
# recevoir les tickets. Pour un usage réel, passez `plan: free` en `starter`.

services:
  - type: web
    name: service-restaurant
    runtime: node
    plan: free
    region: frankfurt

    # Compile l'interface, puis installe l'API sans ses outils de développement.
    buildCommand: cd web && npm ci && npm run build && cd ../backend && npm ci --omit=dev
    startCommand: node backend/src/server.js

    healthCheckPath: /health

    envVars:
      - key: NODE_ENV
        value: production

      # Généré par Render, jamais visible dans le dépôt.
      - key: JWT_SECRET
        generateValue: true

      - key: JWT_EXPIRES_IN
        value: 12h

      # Chaîne de connexion Neon — collez-la au déploiement.
      # Prenez la version SANS « -pooler » dans le nom d'hôte : le serveur
      # garde ses propres connexions ouvertes, le pooler de Neon est destiné
      # aux fonctions serverless.
      - key: DATABASE_URL
        sync: false

      # Premier administrateur, créé uniquement si la base est vide.
      # `sync: false` = Render vous les demande et ne les écrit pas au dépôt.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ADMIN_NAME
        value: Administrateur

      - key: DRIVER_COMMISSION_PERCENT
        value: '70'

      # Crée une carte de démonstration (3 catégories, 5 produits,
      # 7 ingrédients) au tout premier démarrage, pour pouvoir tester
      # immédiatement. Passez à 'false' avant la mise en service réelle.
      - key: SEED_DEMO
        value: 'true'
